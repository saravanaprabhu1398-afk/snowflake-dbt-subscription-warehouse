repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        files: ^generator/
      - id: ruff-format
        files: ^generator/

  - repo: local
    hooks:
      # Uses the project venv so the dbt templater sees the same dbt version as CI.
      - id: sqlfluff-lint
        name: sqlfluff lint (dbt templater)
        entry: .venv/bin/sqlfluff lint
        language: system
        files: ^(models|tests|snapshots)/.*\.sql$
      - id: dbt-parse
        name: dbt parse
        entry: .venv/bin/dbt parse --profiles-dir .
        language: system
        pass_filenames: false
        files: ^(models|tests|snapshots|macros|seeds)/|dbt_project.yml

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt
