version: 2

models:
  - name: stg_customers
    description: One row per customer, latest profile version. PII is nulled for erasure requests.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: email
        meta: {pii_type: email}
      - name: country_code
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('country_reference'), field: country_code}
      - name: updated_at
        data_tests: [not_null]

  - name: stg_plans
    description: Plan catalogue.
    columns:
      - name: plan_id
        data_tests: [unique, not_null]
      - name: billing_period
        data_tests:
          - accepted_values:
              arguments: {values: ['monthly', 'annual']}

  - name: stg_subscription_events
    description: Deduplicated subscription lifecycle events.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['trial_start', 'trial_expired', 'subscription_start', 'renewal', 'upgrade', 'downgrade', 'cancel']
      - name: plan_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_plans'), field: plan_id}
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_customers'), field: customer_id}

  - name: stg_payments
    description: Deduplicated charges and refunds. Card data limited to brand + last 4 + PSP token.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments: {values: ['charge', 'refund']}
      - name: status
        data_tests:
          - accepted_values:
              arguments: {values: ['succeeded', 'failed']}
      - name: currency
        data_tests:
          - relationships:
              arguments: {to: ref('fx_rates'), field: currency}
      - name: card_last4
        description: Last four digits only (PCI-DSS permits storing these unmasked; PAN is never ingested).
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null or length(card_last4) = 4"

  - name: stg_feature_usage
    description: Deduplicated feature telemetry.
    columns:
      - name: usage_event_id
        data_tests: [unique, not_null]
      - name: feature
        data_tests: [not_null]
