name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: .
  CUSTOMERS: "5000"          # small synthetic volume keeps CI under a few minutes

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r requirements.txt
      - name: Generate data (sqlfluff dbt templater compiles the project)
        run: .venv/bin/python generator/generate.py --customers 500 --out data/landing
      - name: dbt deps
        run: .venv/bin/dbt deps
      - name: sqlfluff
        run: .venv/bin/sqlfluff lint models tests snapshots --format github-annotation-native
      - name: ruff (python)
        run: uvx ruff check generator scripts

  dbt-build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r requirements.txt
      - name: Generate synthetic landing data
        run: .venv/bin/python generator/generate.py --customers "$CUSTOMERS" --out data/landing
      - name: dbt deps
        run: .venv/bin/dbt deps --target ci

      # Slim CI: compare against the manifest from the last successful main build.
      - name: Fetch production manifest
        if: github.event_name == 'pull_request'
        id: prod_manifest
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          branch: main
          name: dbt-manifest
          path: prod-state

      - name: dbt build (slim, PR)
        if: github.event_name == 'pull_request' && steps.prod_manifest.outcome == 'success'
        # CI uses a fresh DuckDB file, so upstream parents are built too (+state:modified+).
        # On Snowflake the same step would use --select state:modified+ --defer --state prod-state.
        run: |
          .venv/bin/dbt build --target ci \
            --select "+state:modified+" --state prod-state
      - name: dbt build (full)
        if: github.event_name != 'pull_request' || steps.prod_manifest.outcome != 'success'
        run: .venv/bin/dbt build --target ci

      - name: Incremental path (load 1 then load 2)
        if: github.event_name != 'pull_request'
        run: |
          rm -f data/ci.duckdb
          .venv/bin/dbt build --target ci --vars '{as_of_load_date: "2025-10-01"}'
          .venv/bin/dbt build --target ci

      - name: Source freshness
        run: .venv/bin/dbt source freshness --target ci

      - name: Docs
        run: .venv/bin/dbt docs generate --target ci

      - name: Upload manifest for future slim CI
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest
          path: target/manifest.json
          retention-days: 30

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt + validate (no credentials, no backend)
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  # Deploy to Snowflake on merge to main. Disabled unless the repo variable
  # SNOWFLAKE_DEPLOY_ENABLED=true and secrets are configured (not set in this repo).
  deploy-snowflake:
    runs-on: ubuntu-latest
    needs: [dbt-build, terraform]
    if: github.ref == 'refs/heads/main' && vars.SNOWFLAKE_DEPLOY_ENABLED == 'true'
    environment: production
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/sf_key.p8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r requirements.txt dbt-snowflake
      - run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/sf_key.p8 && chmod 600 /tmp/sf_key.p8
      - uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: ci.yml
          branch: main
          name: dbt-manifest
          path: prod-state
      - name: dbt build changed models in prod (deferred)
        run: |
          .venv/bin/dbt deps --target prod
          if [ -f prod-state/manifest.json ]; then
            .venv/bin/dbt build --target prod --select state:modified+ --state prod-state
          else
            .venv/bin/dbt build --target prod
          fi
